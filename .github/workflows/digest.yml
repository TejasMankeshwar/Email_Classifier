name: Send Daily Email Digest

on:
  schedule:
    # Target delivery: 7:00 AM EST (12:00 UTC).
    # GitHub Actions free-tier `schedule` triggers consistently experience 7–12h queue delays
    # (historically ~8.5h median). Scheduling at 03:37 UTC (~10:37 PM EST) accounts for this
    # delay so the job actually runs around 5:30–8:30 AM EST. Off-peak minute (:37) avoids :00/:30 spikes.
    - cron: '37 3 * * *'

  workflow_dispatch:

concurrency:
  group: email-digest
  cancel-in-progress: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials.json
        run: |
          cat <<'__GMAIL_CREDENTIALS_EOF__' > credentials.json
          ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          __GMAIL_CREDENTIALS_EOF__

      - name: Create token.json
        run: |
          cat <<'__GMAIL_TOKEN_EOF__' > token.json
          ${{ secrets.GMAIL_TOKEN_JSON }}
          __GMAIL_TOKEN_EOF__

      - name: Create token_umass.json
        run: |
          cat <<'__GMAIL_TOKEN_UMASS_EOF__' > token_umass.json
          ${{ secrets.GMAIL_TOKEN_UMASS_JSON }}
          __GMAIL_TOKEN_UMASS_EOF__

      - name: Run G-lassify Digest
        run: |
          set -o pipefail
          mkdir -p logs
          python -m src.main 2>&1 | tee logs/glassify.log
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          LOG_LEVEL: INFO

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glassify-logs
          path: logs/
