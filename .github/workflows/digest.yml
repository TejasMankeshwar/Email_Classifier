name: Send Daily Email Digest

on:
  schedule:
    # GitHub Actions evaluates cron expressions strictly in UTC (the 'timezone' key is not supported).
    # America/New_York is EST (UTC-5) in winter and EDT (UTC-4) in summer.
    # 08:17 UTC corresponds to 03:17 AM EST (04:17 AM EDT).
    # Minute 17 is intentionally chosen to avoid GitHub Actions runner queue delays at :00.
    - cron: '17 8 * * *'

  workflow_dispatch:

concurrency:
  group: email-digest
  cancel-in-progress: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials.json
        run: |
          cat <<'__GMAIL_CREDENTIALS_EOF__' > credentials.json
          ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          __GMAIL_CREDENTIALS_EOF__

      - name: Create token.json
        run: |
          cat <<'__GMAIL_TOKEN_EOF__' > token.json
          ${{ secrets.GMAIL_TOKEN_JSON }}
          __GMAIL_TOKEN_EOF__

      - name: Create token_umass.json
        run: |
          cat <<'__GMAIL_TOKEN_UMASS_EOF__' > token_umass.json
          ${{ secrets.GMAIL_TOKEN_UMASS_JSON }}
          __GMAIL_TOKEN_UMASS_EOF__

      - name: Run G-lassify Digest
        run: |
          set -o pipefail
          mkdir -p logs
          python -m src.main 2>&1 | tee logs/glassify.log
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          LOG_LEVEL: INFO

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glassify-logs
          path: logs/
